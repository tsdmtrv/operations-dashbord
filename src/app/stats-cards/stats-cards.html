<section class="stats">
  <article class="stat-card">
    <p>Total Tasks</p>
    <h2>{{ totalTasks() }}</h2>
  </article>

  <article class="stat-card">
    <p>Completed</p>
    <h2>{{ completedTasks() }}</h2>
  </article>

  <article class="stat-card">
    <p>Pending</p>
    <h2>{{ pendingTasks() }}</h2>
  </article>

  <article class="stat-card">
    <p>In Progress</p>
    <h2>{{ inProgressTasks() }}</h2>
  </article>
</section>
